name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Android Project
        run: |
          if [ ! -d "android-app" ]; then
            echo "ERROR: android-app folder does not exist."
            echo "Create the Android project before building the APK."
            exit 1
          fi

          if [ ! -f "android-app/gradlew" ]; then
            echo "ERROR: android-app/gradlew not found."
            exit 1
          fi

      - name: Grant Execute Permission
        working-directory: android-app
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-App-Builder-Debug-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
