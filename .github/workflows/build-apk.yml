name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android Project
        run: |
          echo "Checking Android project..."

          test -d android-app
          test -f android-app/settings.gradle
          test -f android-app/build.gradle
          test -f android-app/app/build.gradle
          test -f android-app/app/src/main/AndroidManifest.xml

          echo "Android project verified successfully."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Gradle
        run: |
          curl -fsSL \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            -o /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /opt

          echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Verify Gradle
        run: gradle --version

      - name: Build Debug APK
        working-directory: android-app
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        run: |
          APK_PATH="android-app/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK_PATH"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-App-Builder-Debug-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
