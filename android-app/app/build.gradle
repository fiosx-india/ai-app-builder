plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fiosx.aiappbuilder'
    compileSdk 35

    defaultConfig {
        applicationId "com.fiosx.aiappbuilder"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
